# configs/memory_fix_config.yaml
# 内存优化配置

model:
  size: "yolov8n.yaml"  # 使用更小的nano模型
  device: "cuda"
  image_size: 640
  use_attention: false

# 数据配置
data:
  dataset_path: "D:/py/启用主动学习和注意力机制的yolov8/Data"
  img_format: ".png"

# 训练参数 - 内存优化
training:
  epochs_per_iteration: 20  # epochs
  batch_size: 4            # 更小的batch_size
  patience: 8
  learning_rate: 0.01
  weight_decay: 0.0005

# 主动学习配置
active_learning:
  enabled: true
  initial_labeled_ratio: 0.05
  iterations: 3
  samples_per_iteration: 30  # 每次选择的样本数
  sampling_strategy: "uncertainty"
  uncertainty_method: "least_confidence"

# 类别定义
names:
  0: "rc"
  1: "vt"