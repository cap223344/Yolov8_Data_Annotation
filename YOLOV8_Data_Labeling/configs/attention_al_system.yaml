# configs/attention_al_system.yaml
# 注意力机制 + 主动学习系统配置

model:
  size: "yolov8s.yaml"
  device: "cuda"
  image_size: 640
  use_attention: true

# 数据配置
data:
  dataset_path: "D:/py/启用主动学习和注意力机制的yolov8/Data"
  img_format: ".png"

# 训练参数
training:
  epochs_per_iteration: 30
  batch_size: 8
  patience: 10
  learning_rate: 0.01
  weight_decay: 0.0005

# 主动学习配置
active_learning:
  enabled: true
  initial_labeled_ratio: 0.3  # 初始标注数据比例
  iterations: 3               # 主动学习迭代次数
  samples_per_iteration: 50   # 每次迭代选择的样本数
  sampling_strategy: "hybrid"  # uncertainty, diversity, hybrid
  uncertainty_method: "entropy"  # least_confidence, margin, entropy

# 类别定义
names:
  0: "rc"
  1: "vt"